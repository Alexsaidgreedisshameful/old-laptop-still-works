# T440s: TLP handles profiles/device PM; existing helper exclusively owns CPU governor/boost/limits.
TLP_ENABLE=1
TLP_AUTO_SWITCH=1
TLP_PROFILE_AC=PRF
TLP_PROFILE_BAT=BAL
CPU_DRIVER_OPMODE_ON_AC=""
CPU_DRIVER_OPMODE_ON_BAT=""
CPU_DRIVER_OPMODE_ON_SAV=""
CPU_SCALING_GOVERNOR_ON_AC=""
CPU_SCALING_GOVERNOR_ON_BAT=""
CPU_SCALING_GOVERNOR_ON_SAV=""
CPU_SCALING_MIN_FREQ_ON_AC=""
CPU_SCALING_MAX_FREQ_ON_AC=""
CPU_SCALING_MIN_FREQ_ON_BAT=""
CPU_SCALING_MAX_FREQ_ON_BAT=""
CPU_SCALING_MIN_FREQ_ON_SAV=""
CPU_SCALING_MAX_FREQ_ON_SAV=""
CPU_MIN_PERF_ON_AC=""
CPU_MAX_PERF_ON_AC=""
CPU_MIN_PERF_ON_BAT=""
CPU_MAX_PERF_ON_BAT=""
CPU_MIN_PERF_ON_SAV=""
CPU_MAX_PERF_ON_SAV=""
CPU_BOOST_ON_AC=""
CPU_BOOST_ON_BAT=""
CPU_BOOST_ON_SAV=""
CPU_ENERGY_PERF_POLICY_ON_AC=performance
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_power
CPU_ENERGY_PERF_POLICY_ON_SAV=power
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=off
SATA_LINKPWR_ON_AC=max_performance
SATA_LINKPWR_ON_BAT=med_power_with_dipm
PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=default
PCIE_ASPM_ON_SAV=default
# Preserve existing writeback timeouts and disk APM for this first controlled trial.
MAX_LOST_WORK_SECS_ON_AC=""
MAX_LOST_WORK_SECS_ON_BAT=""
DISK_APM_LEVEL_ON_AC=""
DISK_APM_LEVEL_ON_BAT=""
# Keep existing audio timeout and avoid changing radio state/charge thresholds.
SOUND_POWER_SAVE_ON_AC=10
SOUND_POWER_SAVE_ON_BAT=10
RESTORE_THRESHOLDS_ON_BAT=0

# Keep the NVIDIA upstream bridge eligible for suspend on either power source.
RUNTIME_PM_ON_AC=auto
RUNTIME_PM_ON_BAT=auto
RUNTIME_PM_ENABLE="00:1c.4"
# Preserve Wi-Fi PCI runtime policy too, given prior connectivity problems.
RUNTIME_PM_DENYLIST="03:00.0"
WOL_DISABLE=""

AHCI_RUNTIME_PM_ON_AC=auto
DEVICES_TO_DISABLE_ON_STARTUP="bluetooth"
INTEL_GPU_MIN_FREQ_ON_AC=200
INTEL_GPU_MAX_FREQ_ON_AC=1000
INTEL_GPU_BOOST_FREQ_ON_AC=1000
INTEL_GPU_MIN_FREQ_ON_BAT=200
INTEL_GPU_MAX_FREQ_ON_BAT=1000
INTEL_GPU_BOOST_FREQ_ON_BAT=1000
INTEL_GPU_MIN_FREQ_ON_SAV=200
INTEL_GPU_MAX_FREQ_ON_SAV=400
INTEL_GPU_BOOST_FREQ_ON_SAV=400
